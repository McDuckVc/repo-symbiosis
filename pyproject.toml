[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-symbiosis"
dynamic = ["version"]
description = "Git-backed project memory and coordination for coding agents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"

[project.optional-dependencies]
mcp = ["mcp>=1.28,<2"]
app = ["cryptography>=43,<51", "waitress>=3,<4"]

[project.scripts]
symbiosis = "repo_symbiosis.symbiosis:main"
symbiosis-memory = "repo_symbiosis.memory_mcp:main"
symbiosis-app = "repo_symbiosis.app_server:main"

[tool.setuptools]
packages = ["repo_symbiosis"]

[tool.setuptools.package-dir]
repo_symbiosis = "skills/repo-symbiosis/scripts"

[tool.setuptools.dynamic]
version = {attr = "repo_symbiosis.__version__"}
